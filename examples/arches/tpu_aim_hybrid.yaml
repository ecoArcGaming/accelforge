# Hierarchy:
#   MainMemory (HBM, shared)
#     ├── Fork: TPU path
#     │     TPU_GlobalBuffer (128 MB)
#     │       TPU_LocalBuffer [4× spatial]
#     │         ProcessingElement [128×128 spatial]
#     │           Register → TPU_MAC
#     └── AiM path (main hierarchy continues)
#           AiM_BankDRAM [512× spatial PU array]
#             AiM_GlobalBuffer (2 KB per PU)
#               PU_MAC

{% set N_PUS = N_PUS | default(256) %}
{% set FREQ_GHZ = FREQ_GHZ | default(2.0) %}

arch:
  nodes:
  # Shared Main Memory: HBM
  - !Memory
    name: MainMemory
    size: inf
    leak_power: 0
    area: 0
    actions:
    - {name: read,  energy: 7.03e-12, latency: 1 / (8 * 614e9)}
    - {name: write, energy: 7.03e-12, latency: 1 / (8 * 614e9)}
    tensors: {keep: ~Intermediates, may_keep: All}

  # From tpu_v4i.yaml: 128×128 systolic array, 128 MB global buffer
  - !Fork
    nodes:
    - !Memory
      name: TPU_GlobalBuffer
      size: 1024 * 1024 * 128 * 8  # 128 MB
      total_latency: max(read_latency, write_latency)
      leak_power: 0
      area: 112e-6  # 112 mm²
      actions:
      - {name: read,  energy: 1.88e-12, latency: 1 / (8 * 2048e9)}
      - {name: write, energy: 2.36e-12, latency: 1 / (8 * 1024e9)}
      tensors: {keep: ~MainMemory.tensors, may_keep: All}

    - !Memory
      name: TPU_LocalBuffer
      spatial: [{name: Z, fanout: 4, may_reuse: Nothing, min_usage: 1}]
      size: 1024 * 1024 * 4 * 8  # 4 MB
      leak_power: 0
      area: 50e-6  # 50 mm²
      actions:
      - {name: read,  energy: 0.249e-12, latency: 0}
      - {name: write, energy: 0.293e-12, latency: 0}
      tensors: {keep: input | output}

    - !Compute
      name: TPU_ScalarUnit
      area: 10e-6
      leak_power: 0
      actions:
      - {name: compute, energy: 0, latency: 1 / 1.05e9 / 128}
      enabled: len(All) == 2

    - !Container
      name: ProcessingElement
      spatial:
      - {name: reuse_input, fanout: 128, may_reuse: input, reuse: input, min_usage: 1}
      - {name: reuse_output, fanout: 128, may_reuse: output, reuse: output, min_usage: 1}

    - !Memory
      name: TPU_Register
      size: weight.bits_per_value if weight else 0
      area: 1e-11
      leak_power: 0
      actions:
      - {name: read,  energy: 0, latency: 0}
      - {name: write, energy: 0, latency: 0}
      tensors: {keep: weight}

    - !Compute
      name: TPU_MAC
      leak_power: 0
      area: 9e-11
      actions:
      - {name: compute, energy: 0.084e-12, latency: 1 / 1.05e9}
      enabled: len(All) == 3


  - !Memory
    name: GlobalBuffer
    size: 2 * 1024 * 8   # 2 KB gloabl buffer
    total_latency: max(read_latency, write_latency)
    leak_power: 0
    # Rough estimate: 16384 bits 
    area: 2.08e-9 # per bit area in m^2:  assume SOTA from https://www.mdpi.com/2079-9268/2/1/1?utm_source=researchgate.net&utm_medium=article 
    # 2 * 1024 * 8 * 0.127 um^2
    actions:
    # 256-bit access in 1 cycle 
    # Per-bit latency: 1 cycle / 256 bits = 1 / (256 * FREQ)
    # Per-bit energy: power * time / bits = P * (1/FREQ) 
    #   Read:  0.279 mW  
    #   Write: 0.325 mW  
    - {name: read,  energy: 0.139e-12, latency: 1 / (256 * {{FREQ_GHZ}}e9)}
    - {name: write, energy: 0.162e-12, latency: 1 / (256 * {{FREQ_GHZ}}e9)}
    tensors: {keep: All}

  - !Container
    name: PU_Array # 16 x 16 in parallel
    spatial:
    - {name: X, fanout: 16, may_reuse: input}
    - {name: Y, fanout: 16, may_reuse: input}

  - !Compute
    name: PU_MAC
    leak_power: 0
    area: 0.19e-6 / 16 # 0.19 mm² / 16 PUs
    actions:
    # 16 BF16 MACs per cycle at FREQ 
    # Energy: 0.1 pJ/op estimated 
    - {name: compute, energy: 0.1e-12, latency: 1 / ({{FREQ_GHZ}}e9 * 16)}
