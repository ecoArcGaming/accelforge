# GDDR6-AiM Accelerator (parameters from aim_simulator Ramulator model)
#
# Weights pre-loaded in bank DRAM. No PCIe during inference.
#
# Hierarchy:
#   AiM_BankDRAM (top-level, 32 GB/s aggregate internal BW)
#     PU_Array [512 PUs spatial]
#       GlobalBuffer (2 KB per PU)
#         PU_MAC

{% set N_PUS = N_PUS | default(512) %}
{% set FREQ_GHZ = FREQ_GHZ | default(2.0) %}

arch:
  nodes:
  - !Memory
    name: AiM_BankDRAM
    size: inf
    leak_power: 0
    area: 0
    actions:
    # Aggregate internal BW: N_PUS * 32 GB/s per bank
    # Using per-bank rate here; spatial fanout below will divide work
    - {name: read,  energy: 5.5e-12, latency: 1 / ({{N_PUS}} * 256 * {{FREQ_GHZ}}e9) 
    - {name: write, energy: 5.5e-12, latency: 1 / ({{N_PUS}} * 256 * {{FREQ_GHZ}}e9)
    tensors: {keep: ~Intermediates, may_keep: All}

  - !Container
    name: PU_Array
    spatial:
    - {name: Z, fanout: {{N_PUS}}, may_reuse: Nothing, min_usage: 1}

  - !Memory
    name: GlobalBuffer
    size: 2 * 1024 * 8
    leak_power: 0.067e-3
    area: 0
    actions:
    - {name: read,  energy: 0.139e-12, latency: 0} # review paper for this energy, around 1e-12 ball park is probably good 
    - {name: write, energy: 0.162e-12, latency: 0} # these were divided by an extra 256 it seems 
    tensors: {keep: All}

  - !Compute
    name: PU_MAC
    leak_power: 0
    area: 0
    actions:
    - {name: compute, energy: 0.1e-12, latency: 1 / ({{FREQ_GHZ}}e9 * 16)}
