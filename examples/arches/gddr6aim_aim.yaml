{% set N_PUS = N_PUS | default(512) %}
{% set FREQ_GHZ = FREQ_GHZ | default(2.0) %}

arch:
  nodes:
  - !Memory
    name: AiM_BankDRAM
    size: inf
    leak_power: 0
    area: 0
    actions:
    - {name: read,  energy: 5.5e-12, latency: 2 / ({{N_PUS}} * 256 * {{FREQ_GHZ}}e9)} # 2 cycles per read or write
    - {name: write, energy: 5.5e-12, latency: 2 / ({{N_PUS}} * 256 * {{FREQ_GHZ}}e9)}
    tensors: {keep: ~Intermediates, may_keep: All}

  - !Container
    name: PU_Array
    spatial:
    # input broadcast across PUs,
    - {name: Z, fanout: {{N_PUS}}, may_reuse: input}

  - !Memory
    name: GlobalBuffer
    size: 2 * 1024 * 8   # 2 KB per PU (paper Section 2A)
    total_latency: max(read_latency, write_latency)
    leak_power: 0
    area: 0
    actions:
    # 256-bit access in 1 cycle 
    # Per-bit latency: 1 cycle / 256 bits = 1 / (256 * FREQ)
    # Per-bit energy: power * time / bits = P * (1/FREQ) 
    #   Read:  0.279 mW  
    #   Write: 0.325 mW  
    - {name: read,  energy: 0.139e-12, latency: 1 / (256 * {{FREQ_GHZ}}e9)}
    - {name: write, energy: 0.162e-12, latency: 1 / (256 * {{FREQ_GHZ}}e9)}
    tensors: {keep: All}

  - !Compute
    name: PU_MAC
    leak_power: 0
    area: 0
    actions:
    # 16 BF16 MACs per cycle at FREQ 
    # Energy: 0.1 pJ/op estimated 
    - {name: compute, energy: 0.1e-12, latency: 1 / ({{FREQ_GHZ}}e9 * 16)}
