{% set FREQ_GHZ = FREQ_GHZ | default(1.0) %}
{% set AIM_BUFFER_KB = AIM_BUFFER_KB | default(2) %}
{% set AIM_PU_FANOUT = AIM_PU_FANOUT | default(16) %}

arch:
  nodes:
  # Shared Main Memory: HBM
  - !Memory
    name: MainMemory
    size: 8 * 1024 * 1024 * 1024 * 8 # 8 GB HBM
    leak_power: 0
    area: 0
    actions:
    - {name: read,  energy: 5.362e-12, latency: 1/(8*512e9)} #  DRAM internal bandwidth
    - {name: write, energy: 4.382e-12, latency: 1/(8*512e9)}
    tensors: {keep: All, may_keep: All} # keep all = no fusion, keep ~intermdaites = fusion

  - !Fork
    nodes:
    - !Toll
      name: OffChipLink
      leak_power: 0
      direction: "up_and_down"
      area: 0
      tensors: {keep: All & Above}
      actions: [{name: read, energy: 7.03e-12, latency: 1/(8*32e9)}] # DRAM external bandwidth, energy from TPU
    - !Memory
      name: TPU_GlobalBuffer
      size: 1024 * 1024 * 128 * 8  # 128 MB
      total_latency: max(read_latency, write_latency)
      leak_power: 0
      area: 112e-6  # 112 mm²
      actions:
      - {name: read,  energy: 1.88e-12, latency: 1 / (8 * 2048e9)}
      - {name: write, energy: 2.36e-12, latency: 1 / (8 * 1024e9)}
      tensors: {keep: ~MainMemory.tensors, may_keep: All}

    - !Memory
      name: TPU_LocalBuffer
      spatial: [{name: Z, fanout: 4, may_reuse: Nothing, min_usage: 1}]
      size: 1024 * 1024 * 4 * 8  # 4 MB
      leak_power: 0
      area: 50e-6  # 50 mm²
      actions:
      - {name: read,  energy: 0.249e-12, latency: 0}
      - {name: write, energy: 0.293e-12, latency: 0}
      tensors: {keep: input | output}

    - !Compute
      name: TPU_ScalarUnit
      area: 10e-6
      leak_power: 0
      actions:
      - {name: compute, energy: 0, latency: 1 / 1.05e9 / 128}
      enabled: len(All) == 2

    - !Container
      name: ProcessingElement
      spatial:
      - {name: reuse_input, fanout: 128, may_reuse: input, reuse: input, min_usage: 1}
      - {name: reuse_output, fanout: 128, may_reuse: output, reuse: output, min_usage: 1}

    - !Memory
      name: TPU_Register
      size: weight.bits_per_value if weight else 0
      area: 1e-11
      leak_power: 0
      actions:
      - {name: read,  energy: 0, latency: 0}
      - {name: write, energy: 0, latency: 0}
      tensors: {keep: weight}

    - !Compute
      name: TPU_MAC
      leak_power: 0
      area: 9e-11
      actions:
      - {name: compute, energy: 0.084e-12, latency: 1 / 1.05e9}
      enabled: len(All) == 3

  # aim accelerator — buffer size and PU fanout are swept
  - !Memory
    name: GlobalBuffer
    size: {{AIM_BUFFER_KB}} * 1024 * 8   # AiM per-PU global buffer (bits)
    component_class: SmartBufferSRAM
    tensors: {may_keep: All}
    extra_attributes_for_component_model: {tech_node: 40e-9} # assume standard 40 nm SRAM

  - !Container
    name: PU_Array # AIM_PU_FANOUT × AIM_PU_FANOUT PUs
    spatial:
      - {name: reuse_input, fanout: {{AIM_PU_FANOUT}}, may_reuse: input, reuse: input, min_usage: 1}
      - {name: reuse_output, fanout: {{AIM_PU_FANOUT}}}

  - !Compute
    name: PU_MAC
    leak_power: 0
    area: 0.19e-6 / 16 # per-PU area (m²); from 0.19 mm² / 16 baseline
    actions:
    # Energy: 0.1 pJ/op estimated
    - {name: compute, energy: 0.1e-12, latency: 1 / ({{FREQ_GHZ}}e9 * 16)}
