# GPT-3-like transformer workload with small ranks for fast mapper evaluation.
# Covers the full pipeline: projections, attention, FFN.
# Rank ratios match GPT-3 6.7B (H=32, E=128, D=4096, C=16384).
# Scaled down by 64x for mapper speed.

workload:
  rank_sizes:
    {% set BATCH_SIZE = BATCH_SIZE | default(1) %}
    {% set N_TOKENS = N_TOKENS | default(1) %}
    B: {{BATCH_SIZE}}
    P: {{N_TOKENS}}
    M: {{N_TOKENS}}
    H: 4            # 32/8
    E: 16           # 128/8
    F: 16
    D: 64           # H*E = 4*16
    C: 256          # 16384/64
    J: 64           # 4096/64
    G: 64

  bits_per_value: {All: 16}
  persistent_tensors: weight - Intermediates

  einsums:
  - {einsum: "I[b, m, d] = I_in[b, m, d]", is_copy_operation: True}

  # QKV projections (compute-bound at large batch, memory-bound at batch=1)
  - "V[b, m, h, e] = I[b, m, d] * WV[h, e, d]"
  - "K[b, m, h, e] = I[b, m, d] * WK[h, e, d]"
  - "Q[b, m, h, e] = I[b, m, d] * WQ[h, e, d]"

  # Attention (compute-bound, scales with N_TOKENS^2)
  - einsum: "QK[b, m, p, h] = Q[b, m, h, e] * K[b, M: p, h, e]"
    renames: {input: Q}
  - "QK_softmax[b, m, p, h] = QK[b, m, p, h]"

  - einsum: "AV[b, m, h, f] = QK_softmax[b, m, p, h] * V[b, M: p, h, E: f]"
    renames: {input: QK_softmax}

  # Output projection + FFN
  - "Z[b, m, g] = AV[b, m, h, f] * WZ[h, f, g]"
  - "FFA[b, m, c] = Z[b, m, g] * WFFA[g, c]"
  - "FFB[b, m, j] = FFA[b, m, c] * WFFB[c, j]"

renames:
  einsums:
  - name: default
    tensor_accesses:
    - name: input
      source: Inputs & Intermediates if len(All) == 3 else Inputs
      expected_count: 1
    - name: output
      source: Outputs
      expected_count: 1
    - name: weight
      source: ~(input | output)
      expected_count: 1 if len(All) == 3 else 0
